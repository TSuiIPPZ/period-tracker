<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="肥宇月记">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAFAFA">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%E8%82%A5%E5%AE%87%E6%9C%88%E8%AE%B0%22%2C%22short_name%22%3A%22%E8%82%A5%E5%AE%87%E6%9C%88%E8%AE%B0%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FAFAFA%22%2C%22theme_color%22%3A%22%23FAFAFA%22%7D">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>肥宇月记</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow-x:hidden;background:#FAFAFA;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;color:#333}
  #calendar{height:100vh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}

  /* 年份悬浮栏 + 安全区 + 距上次小字 */
  #yearBar{position:sticky;top:0;z-index:6;background:rgba(250,250,250,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:.5px solid rgba(0,0,0,.06);padding-top:calc(env(safe-area-inset-top) + 30px) !important;padding-bottom:6px}
  #yearBar .year{font-size:19px;color:#222;font-weight:700;text-align:center;letter-spacing:3px;padding:4px 16px 2px}
  #yearBar .sub{font-size:11px;color:#999;text-align:center;letter-spacing:1px;padding-bottom:6px}

  /* 日历网格 */
  .month{padding:8px 14px 26px}
  .month-title{font-size:32px;color:#1a1a1a;padding:20px 4px 14px;font-weight:800;text-align:center;letter-spacing:2px}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:#333;text-align:center;padding-bottom:8px;font-weight:700}
  .days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:14px}
  .day{position:relative;aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;font-size:14px;color:#1a1a1a}
  .day.empty{visibility:hidden}
  .day .num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:2px;font-weight:700}
  .day.today .num{background:#E53935;color:#fff;font-size:13px}
  .day .mini-heart-wrap{width:100%;display:flex;justify-content:center;align-items:center;margin-top:2px}
  .mini-heart{width:27px;height:24px;flex-shrink:0}

  /* 回到今日按钮 */
  #backToday{position:fixed;right:16px;bottom:28px;z-index:20;width:44px;height:44px;border-radius:50%;background:#E53935;color:#fff;border:none;font-size:12px;font-weight:700;letter-spacing:1px;box-shadow:0 4px 16px rgba(229,57,53,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(20px);transition:opacity .25s,transform .25s}
  #backToday.show{opacity:1;transform:translateY(0)}

  /* ===== 磨砂浮层（黑心隐藏/下滑呼出版） ===== */
  .overlay{position:fixed;inset:0;background-color:rgba(255,255,255,0.45);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;z-index:100;visibility:hidden;opacity:0;transition:opacity .18s ease}
  .overlay.show{visibility:visible;opacity:1}
  .overlay-card{width:82vw;max-width:310px;background-color:rgba(255,255,255,0.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.14);transform:scale(.92);transition:transform .2s cubic-bezier(.34,1.56,.64,1), padding .25s ease, gap .25s ease;overflow:hidden}
  .overlay.show .overlay-card{transform:scale(1)}
  .heart-wrap{width:90px;height:80px;display:block;background:transparent;overflow:visible;filter:drop-shadow(0 6px 18px rgba(0,0,0,.16)) drop-shadow(0 2px 4px rgba(0,0,0,.08));transition:opacity .28s ease, transform .28s ease, max-height .28s ease, margin .28s ease}
  .heart-svg{width:100%;height:100%;display:block;background:transparent}

  /* 黑心初始隐藏，下滑时 .show 呼出 */
  #blackWrap{opacity:0;max-height:0;transform:translateY(-12px);margin-top:0;pointer-events:none}
  #blackWrap.show{opacity:1;max-height:100px;transform:translateY(0);margin-top:4px;pointer-events:auto}
</style>
</head>
<body>
<div id="calendar">
  <div id="yearBar">
    <div class="year">2026 年</div>
    <div class="sub">距上次开始已过 <span id="daysSince">0</span> 天</div>
  </div>
  <div id="months"></div>
</div>
<button id="backToday">今日</button>

<div id="overlay" class="overlay">
  <div class="overlay-card">
    <div class="heart-wrap" id="redWrap">
      <svg viewBox="0 0 100 90" class="heart-svg" id="redHeart">
        <defs>
          <clipPath id="clipRed"><path d="M50 86 C18 62,4 46,4 26 C4 12,16 4,30 4 C40 4,47 12,50 18 C53 12,60 4,70 4 C84 4,96 12,96 26 C96 46,82 62,50 86 Z"/></clipPath>
          <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF8A80"/><stop offset="100%" stop-color="#C62828"/></linearGradient>
        </defs>
        <path d="M50 86 C18 62,4 46,4 26 C4 12,16 4,30 4 C40 4,47 12,50 18 C53 12,60 4,70 4 C84 4,96 12,96 26 C96 46,82 62,50 86 Z" fill="none" stroke="#E53935" stroke-width="4"/>
        <path d="M50 86 C18 62,4 46,4 26 C4 12,16 4,30 4 C40 4,47 12,50 18 C53 12,60 4,70 4 C84 4,96 12,96 26 C96 46,82 62,50 86 Z" fill="#fbeaea"/>
        <g clip-path="url(#clipRed)"><rect id="redFill" x="0" y="90" width="100" height="0" fill="url(#redGrad)"/></g>
      </svg>
    </div>
    <div class="heart-wrap" id="blackWrap">
      <svg viewBox="0 0 100 90" class="heart-svg" id="blackHeart">
        <defs>
          <clipPath id="clipBlack"><path d="M50 86 C18 62,4 46,4 26 C4 12,16 4,30 4 C40 4,47 12,50 18 C53 12,60 4,70 4 C84 4,96 12,96 26 C96 46,82 62,50 86 Z"/></clipPath>
          <linearGradient id="blackGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#555"/><stop offset="100%" stop-color="#1a1a1a"/></linearGradient>
        </defs>
        <path d="M50 86 C18 62,4 46,4 26 C4 12,16 4,30 4 C40 4,47 12,50 18 C53 12,60 4,70 4 C84 4,96 12,96 26 C96 46,82 62,50 86 Z" fill="none" stroke="#222" stroke-width="4"/>
        <path d="M50 86 C18 62,4 46,4 26 C4 12,16 4,30 4 C40 4,47 12,50 18 C53 12,60 4,70 4 C84 4,96 12,96 26 C96 46,82 62,50 86 Z" fill="#ececec"/>
        <g clip-path="url(#clipBlack)"><rect id="blackFill" x="0" y="90" width="100" height="0" fill="url(#blackGrad)"/></g>
      </svg>
    </div>
  </div>
</div>

<script>
(function(){
  const KEY='period_blood_records_v1';
  let records=JSON.parse(localStorage.getItem(KEY)||'{}');
  const save=()=>localStorage.setItem(KEY,JSON.stringify(records));
  const pad=n=>n<10?'0'+n:''+n;
  const dkey=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
  const todayStr=()=>{const x=new Date();return dkey(x.getFullYear(),x.getMonth(),x.getDate())};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const addMonths=(y,m,d)=>{m+=d;while(m<0){m+=12;y--}while(m>11){m-=12;y++}return{y,m}};
  const addDays=(s,n)=>{const x=new Date(s+'T00:00:00');x.setDate(x.getDate()+n);return dkey(x.getFullYear(),x.getMonth(),x.getDate())};

  function miniHeartHtml(blood,color){
    if(!blood && !color) return '';
    const tier = blood>0?blood:color;
    const isBlood = blood>0;
    const redShade=['#FFCDD2','#EF9A9A','#E57373','#E53935','#C62828','#B71C1C'][blood]||'#FFCDD2';
    const blackShade=['#ddd','#999','#666','#444','#222','#000'][color]||'#ddd';
    const fillColor = isBlood?redShade:blackShade;
    const strokeColor = isBlood?'#E53935':'#222';
    const bgColor = isBlood?'#fbeaea':'#ececec';
    const fillH = (clamp(tier,0,5)/5)*22;
    const id = 'mh'+(isBlood?'r':'b')+tier+Math.random().toString(36).slice(2,6);
    return `<span class="mini-heart-wrap"><svg class="mini-heart" viewBox="0 0 24 22">
      <defs><clipPath id="${id}"><path d="M12 20 C4 14,1 10,1 6 C1 3,3 1,5 1 C7 1,9 3,12 5 C15 3,17 1,19 1 C21 1,23 3,23 6 C23 10,20 14,12 20 Z"/></clipPath></defs>
      <path d="M12 20 C4 14,1 10,1 6 C1 3,3 1,5 1 C7 1,9 3,12 5 C15 3,17 1,19 1 C21 1,23 3,23 6 C23 10,20 14,12 20 Z" fill="${bgColor}" stroke="${strokeColor}" stroke-width="0.9"/>
      <g clip-path="url(#${id})"><rect x="0" y="${(22-fillH).toFixed(2)}" width="24" height="${fillH.toFixed(2)}" fill="${fillColor}"/></g>
    </svg></span>`;
  }

  const calendar=document.getElementById('calendar');
  const months=document.getElementById('months');
  const yearBarEl=document.querySelector('#yearBar .year');
  const daysSinceEl=document.getElementById('daysSince');
  const overlay=document.getElementById('overlay');
  const redFill=document.getElementById('redFill');
  const blackFill=document.getElementById('blackFill');
  const blackWrap=document.getElementById('blackWrap');
  const backTodayBtn=document.getElementById('backToday');

  function buildMonth(y,m){
    const el=document.createElement('div');
    el.className='month';
    el.dataset.year=y;el.dataset.month=m;
    const offset=new Date(y,m,1).getDay();
    const dim=new Date(y,m+1,0).getDate();
    const tk=todayStr();
    let h=`<div class="month-title">${m+1}月</div>`;
    h+='<div class="weekdays">'+['日','一','二','三','四','五','六'].map(w=>`<span>${w}</span>`).join('')+'</div>';
    h+='<div class="days">';
    for(let i=0;i<offset;i++) h+='<div class="day empty"></div>';
    for(let d=1;d<=dim;d++){
      const k=dkey(y,m,d);
      const r=records[k];
      const heartHtml=r?miniHeartHtml(r.blood,r.color):'';
      h+=`<div class="day${k===tk?' today':''}" data-date="${k}"><span class="num">${d}</span>${heartHtml}</div>`;
    }
    h+='</div>';
    el.innerHTML=h;
    return el;
  }

  const now=new Date();
  let rendered={min:addMonths(now.getFullYear(),now.getMonth(),-2),max:addMonths(now.getFullYear(),now.getMonth(),2)};

  function init(){
    for(let y=rendered.min.y,m=rendered.min.m;;){
      months.appendChild(buildMonth(y,m));
      if(y===rendered.max.y&&m===rendered.max.m) break;
      const n=addMonths(y,m,1);y=n.y;m=n.m;
    }
    yearBarEl.textContent=now.getFullYear()+' 年';
    updateDaysSince();
    requestAnimationFrame(()=>{
      const t=document.querySelector('.day.today');
      if(t) t.scrollIntoView({block:'center'});
      requestAnimationFrame(updateYearBar);
    });
  }

  function updateYearBar(){
    const cards=months.querySelectorAll('.month');
    const midY=calendar.scrollTop+calendar.clientHeight*0.35;
    for(const c of cards){
      if(c.offsetTop<=midY && c.offsetTop+c.offsetHeight>midY){
        yearBarEl.textContent=parseInt(c.dataset.year,10)+' 年';
        return;
      }
    }
  }

  function updateDaysSince(){
    // 取出所有有实质数据的记录日期（blood>0 或 color>0），按日期升序排列
    const keys=Object.keys(records).filter(k=>{const r=records[k];return r&&(r.blood>0||r.color>0)}).sort();
    if(!keys.length){daysSinceEl.textContent='0';return}
    const tk=todayStr();
    // 从后往前找离今天最近且 <= 今天 的那条记录
    let lastIdx=keys.length-1;
    while(lastIdx>=0&&keys[lastIdx]>tk) lastIdx--;
    if(lastIdx<0){daysSinceEl.textContent='0';return}
    const lastDate=keys[lastIdx];
    // 用本地日期计算，避免 Safari 的 UTC 解析差异
    const a=new Date(tk+'T00:00:00');
    const b=new Date(lastDate+'T00:00:00');
    daysSinceEl.textContent=Math.round((a-b)/86400000);
  }

  function updateBackBtn(){
    const t=document.querySelector('.day.today');
    if(!t){backTodayBtn.classList.remove('show');return}
    const r=t.getBoundingClientRect();
    if(r.top < 100 || r.bottom > window.innerHeight - 40) backTodayBtn.classList.add('show');
    else backTodayBtn.classList.remove('show');
  }

  calendar.addEventListener('scroll',()=>{
    const{scrollTop:st,scrollHeight:sh,clientHeight:ch}=calendar;
    if(sh-st-ch<400){
      const n=addMonths(rendered.max.y,rendered.max.m,1);
      months.appendChild(buildMonth(n.y,n.m));rendered.max=n;
    }
    if(st<400){
      const p=addMonths(rendered.min.y,rendered.min.m,-1);
      const old=calendar.scrollHeight;
      months.prepend(buildMonth(p.y,p.m));
      calendar.scrollTop+=calendar.scrollHeight-old;
      rendered.min=p;
    }
    updateYearBar();
    updateBackBtn();
  },{passive:true});

  backTodayBtn.addEventListener('click',()=>{
    let t=document.querySelector('.day.today');
    if(!t){
      const today=new Date();
      const tm={y:today.getFullYear(),m:today.getMonth()};
      months.innerHTML='';
      const newMin=addMonths(tm.y,tm.m,-2),newMax=addMonths(tm.y,tm.m,2);
      rendered={min:newMin,max:newMax};
      for(let y=newMin.y,m=newMin.m;;){
        months.appendChild(buildMonth(y,m));
        if(y===newMax.y&&m===newMax.m) break;
        const n=addMonths(y,m,1);y=n.y;m=n.m;
      }
      t=document.querySelector('.day.today');
      updateYearBar();
    }
    if(t) calendar.scrollTo({top:t.offsetTop-calendar.clientHeight/2+t.clientHeight/2,behavior:'smooth'});
    updateBackBtn();
  });

  // ============== 交互：隐藏黑心，下滑呼出 ==============
  let pressTimer=null,pressStart={x:0,y:0};
  let overlayOpen=false,activeDate='';
  let centerY=0;
  let bloodTier=0,colorTier=0;
  let initialBloodTier=0;  // 记录长按初始血量，用于下滑减血起点
  let blackFullPopped=false; // 标记黑心是否已满血弹出过

  function setFill(fill, tier){
    const h=(clamp(tier,0,5)/5)*90;
    fill.setAttribute('height',h.toFixed(2));
    fill.setAttribute('y',(90-h).toFixed(2));
  }

  function openOverlay(){
    centerY=pressStart.y;
    overlayOpen=true;
    overlay.classList.add('show');
    calendar.style.touchAction='none';
    setFill(redFill,bloodTier);
    setFill(blackFill,0);
    // 初始只显示红心，黑心隐藏（除非已有 color 记录）
    if(colorTier>0.01){
      blackWrap.classList.add('show');
      setFill(blackFill,colorTier);
    }else{
      blackWrap.classList.remove('show');
    }
    blackFullPopped=false;
  }
  function closeOverlay(){
    overlayOpen=false;
    overlay.classList.remove('show');
    calendar.style.touchAction='pan-y';
    blackWrap.classList.remove('show');
    blackFullPopped=false;
  }

  /**
   * 新交互逻辑（反向）：
   *   上滑 (dy<=0) → 红心从初始血量增加到满
   *   下滑 (dy>0)  → 分两段：
   *     第一段：红心从初始血量减到 0
   *     红心归零后黑心弹出（满血100%），继续下滑黑心掉血到 0
   *     黑心归零松手 = 取消记录
   */
  function handleSlide(x,y){
    const dy=y-centerY;
    const maxUp=140;       // 上滑最大距离（红心增加）
    const redRange=80;     // 下滑第一段：红心归零距离
    const blackRange=80;   // 下滑第二段：黑心从满血归零距离

    if(dy<=0){
      // === 上滑：红心血量增加 ===
      const progress=clamp(-dy/maxUp,0,1);
      // 从初始血量到满血量(5) 线性插值
      bloodTier=initialBloodTier + progress*(5-initialBloodTier);
      setFill(redFill,bloodTier);
      colorTier=0;setFill(blackFill,0);
      blackWrap.classList.remove('show');
      blackFullPopped=false;
    }else if(dy<=redRange){
      // === 下滑第一段：红心血量从初始值减到 0 ===
      const progress=dy/redRange;
      bloodTier=(1-progress)*initialBloodTier;
      setFill(redFill,bloodTier);
      colorTier=0;setFill(blackFill,0);
      blackWrap.classList.remove('show');
      blackFullPopped=false;
    }else{
      // === 下滑第二段：红心已归零，黑心弹出并掉血 ===
      bloodTier=0;setFill(redFill,0);
      // 第一次进入：黑心从下方弹出，弹出瞬间满血(100%)
      if(!blackFullPopped){
        blackWrap.classList.add('show');
        colorTier=5;
        setFill(blackFill,colorTier);
        blackFullPopped=true;
      }
      // 继续下滑：黑心血量从5减到0
      const blackProgress=clamp((dy-redRange)/blackRange,0,1);
      colorTier=(1-blackProgress)*5;
      setFill(blackFill,colorTier);
    }
  }

  function saveAndClose(){
    const b=Math.round(bloodTier),c=Math.round(colorTier);
    if(b===0 && c===0){delete records[activeDate]}
    else{records[activeDate]={blood:b,color:c}}
    save();closeOverlay();refreshDay(activeDate);updateDaysSince();updateBackBtn();
  }

  function refreshDay(k){
    const cells=document.querySelectorAll('.day[data-date="'+k+'"]');
    const r=records[k];
    cells.forEach(cell=>{
      cell.querySelectorAll('.mini-heart-wrap').forEach(h=>h.remove());
      if(r){
        const tmp=document.createElement('template');
        tmp.innerHTML=miniHeartHtml(r.blood,r.color);
        cell.appendChild(tmp.content.firstChild);
      }
    });
  }

  overlay.addEventListener('click',e=>{
    if(!overlayOpen) return;
    if(e.target===overlay) saveAndClose();
  });

  function startPress(cell,x,y){
    if(overlayOpen) return;
    if(!cell||cell.classList.contains('empty')) return;
    pressStart={x,y};activeDate=cell.dataset.date;
    const r=records[activeDate];
    bloodTier=r?r.blood:0;colorTier=r?r.color:0;
    initialBloodTier=bloodTier;  // 记录初始血量，用于下滑减血的起点
    blackFullPopped=false;
    pressTimer=setTimeout(openOverlay,400);
  }
  function movePress(x,y,e){
    if(!overlayOpen){
      if(Math.hypot(x-pressStart.x,y-pressStart.y)>10){if(pressTimer){clearTimeout(pressTimer);pressTimer=null}}
      return;
    }
    if(e) e.preventDefault();
    handleSlide(x,y);
  }
  function endPress(x,y){
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null}
    if(overlayOpen) saveAndClose();
  }

  months.addEventListener('touchstart',e=>{
    const cell=e.target.closest('.day');
    startPress(cell,e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  document.addEventListener('touchmove',e=>movePress(e.touches[0].clientX,e.touches[0].clientY,e),{passive:false});
  document.addEventListener('touchend',e=>endPress(e.changedTouches[0].clientX,e.changedTouches[0].clientY));
  document.addEventListener('mousedown',e=>{const cell=e.target.closest('.day');startPress(cell,e.clientX,e.clientY)});
  document.addEventListener('mousemove',e=>movePress(e.clientX,e.clientY,e));
  document.addEventListener('mouseup',e=>endPress(e.clientX,e.clientY));
  document.addEventListener('contextmenu',e=>e.preventDefault());

  init();
})();
</script>
</body>
</html>
